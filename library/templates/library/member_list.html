{% extends "library/base.html" %}
{% block content %}
  <h1 class="text-4xl font-bold text-slate-800 mb-6">
    Members 👥
  </h1>
  {% for member in members %}
    <article class="bg-white rounded-xl shadow-md p-6 mb-4" >
      <h2  class="text-2xl font-bold text-slate-600 mb-2" >{{ member.name }}</h2>
      <p class="text-gray-600" >{{ member.email }} </p>
    </article>
    {% empty %}
    <p class="text-gray-500 text-lg">Member not found!</p>
  {% endfor %}
{% endblock %}
