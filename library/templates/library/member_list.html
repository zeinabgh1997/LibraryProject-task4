{% extends "library/base.html" %}
{% block content %}
  <h1 class="text-4xl font-bold text-slate-800 mb-6">
    Members 👥
  </h1>

   
  <form method="post" action="{% url 'add_member'  %}" class="flex gap-3 mb-10">
    {% csrf_token %}

    <input name="name" placeholder="Name" class="px-4 py-3 border-2 border-gray-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" >
    <input name="email" placeholder="Email" class="px-4 py-3 border-2 border-gray-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

    <button type="submit" class="px-6 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition cursor-pointer" >
      Add Member
    </button>
  </form>
  {% for member in members %}
    <article class="bg-white rounded-xl shadow-md p-6 mb-4" >
      <h2  class="text-2xl font-bold text-slate-600 mb-2" >{{ member.name }}</h2>
      <p class="text-gray-600" >{{ member.email }} </p>
      <a href="{% url 'member_history' member.id %}"
        class="inline-block mt-4 px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition cursor-pointer">
        📋 View History
      </a>
    </article>
    {% empty %}
    <p class="text-gray-500 text-lg">Member not found!</p>
  {% endfor %}
{% endblock %}
